<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" role="img">
<title>Where discretion breaks down along the delivery trail</title>
<desc>Order confirmation, payment descriptor, packaging and label, customs, and final delivery each carry different risks.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="28" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="14" font-weight="500" fill="#1c2b2a" text-anchor="start" dominant-baseline="central">Where discretion breaks down</text>
<rect x="70" y="80" width="108" height="70" rx="8" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="124.0" y="105" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Order</text>
<text x="124.0" y="130" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">Shared email inbox</text>
<line x1="176" y1="115.0" x2="190" y2="115.0" stroke="#e2e8e6" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="178" y="80" width="108" height="70" rx="8" fill="#fdeaea" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="232.0" y="105" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Payment</text>
<text x="232.0" y="130" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="11" font-weight="400" fill="#b42318" text-anchor="middle" dominant-baseline="central">Billing descriptor</text>
<line x1="284" y1="115.0" x2="298" y2="115.0" stroke="#e2e8e6" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="286" y="80" width="108" height="70" rx="8" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="340.0" y="105" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Ship</text>
<text x="340.0" y="130" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">Tracking page</text>
<line x1="392" y1="115.0" x2="406" y2="115.0" stroke="#e2e8e6" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="394" y="80" width="108" height="70" rx="8" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="448.0" y="105" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Customs</text>
<text x="448.0" y="130" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">Declaration + duty invoice</text>
<line x1="500" y1="115.0" x2="514" y2="115.0" stroke="#e2e8e6" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="502" y="80" width="108" height="70" rx="8" fill="#fdeaea" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="556.0" y="105" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Deliver</text>
<text x="556.0" y="130" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="11" font-weight="400" fill="#b42318" text-anchor="middle" dominant-baseline="central">Doorbell cam / neighbour</text>
<text x="40" y="210" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="13" font-weight="500" fill="#1c2b2a" text-anchor="start" dominant-baseline="central">The honest limits</text>
<text x="40" y="236" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Discretion covers the box, label and statement. It does not cover household members opening post,</text>
<text x="40" y="254" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">shared email inboxes, browser history, logged-in accounts, or a neighbour signing for the parcel.</text>
</svg>
