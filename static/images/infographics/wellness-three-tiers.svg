<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img">
<title>Three-tier wellness routine</title>
<desc>Tier 1 is the floor for bad weeks, tier 2 is normal week, tier 3 is good week. Dropping a level is the system working, not failing.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="28" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1c2b2a" text-anchor="start" dominant-baseline="central">Build a routine with tiers</text>
<rect x="40" y="58" width="600" height="84" rx="10" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="58" y="82" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="500" fill="#2f7d6b" text-anchor="start" dominant-baseline="central">Tier 3</text>
<text x="120" y="82" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">The good week</text>
<text x="58" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">What you do when you have time and energy</text>
<rect x="40" y="152" width="600" height="84" rx="10" fill="#ffffff" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="58" y="176" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="500" fill="#2f7d6b" text-anchor="start" dominant-baseline="central">Tier 2</text>
<text x="120" y="176" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">The normal week</text>
<text x="58" y="204" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Achievable alongside ordinary demands</text>
<rect x="40" y="246" width="600" height="84" rx="10" fill="#2f7d6b" stroke="#e2e8e6" stroke-width="0.5"/>
<text x="58" y="270" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="500" fill="#ffffff" text-anchor="start" dominant-baseline="central">Tier 1</text>
<text x="120" y="270" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#ffffff" text-anchor="start" dominant-baseline="central">The floor</text>
<text x="58" y="298" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start" dominant-baseline="central">Ten minutes total. Defend this first.</text>
</svg>
