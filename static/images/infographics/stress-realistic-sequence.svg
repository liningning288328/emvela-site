<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" role="img">
<title>A realistic intervention sequence</title>
<desc>Three-step escalation: two weeks of sleep fixes, then structured stress work, then blood work and a clinician.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="28" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1c2b2a" text-anchor="start" dominant-baseline="central">A realistic sequence</text>
<rect x="90" y="60" width="160" height="120" rx="10" fill="#f6f9f8" stroke="#1f5a4c" stroke-width="0.5"/>
<text x="104" y="84" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="500" fill="#2f7d6b" text-anchor="start" dominant-baseline="central">Step 1</text>
<text x="104" y="108" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">Two weeks</text>
<text x="104" y="130" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Fixed sleep window, no</text>
<text x="104" y="146" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">alcohol, morning</text>
<text x="104" y="162" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">daylight. Track sleep</text>
<text x="104" y="178" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">and energy only.</text>
<line x1="254" y1="120.0" x2="301" y2="120.0" stroke="#1f5a4c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305" y="60" width="160" height="120" rx="10" fill="#f6f9f8" stroke="#1f5a4c" stroke-width="0.5"/>
<text x="319" y="84" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="500" fill="#2f7d6b" text-anchor="start" dominant-baseline="central">Step 2</text>
<text x="319" y="108" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">If nothing moves</text>
<text x="319" y="130" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Add structured stress</text>
<text x="319" y="146" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">work: CBT-based</text>
<text x="319" y="162" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">programme or referral.</text>
<line x1="469" y1="120.0" x2="516" y2="120.0" stroke="#1f5a4c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520" y="60" width="160" height="120" rx="10" fill="#f6f9f8" stroke="#1f5a4c" stroke-width="0.5"/>
<text x="534" y="84" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="500" fill="#2f7d6b" text-anchor="start" dominant-baseline="central">Step 3</text>
<text x="534" y="108" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">If it is still unchanged</text>
<text x="534" y="130" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Blood work and a</text>
<text x="534" y="146" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">conversation with a</text>
<text x="534" y="162" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">clinician.</text>
</svg>
