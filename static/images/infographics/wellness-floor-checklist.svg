<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" role="img">
<title>The four items that belong in the floor</title>
<desc>A minimum viable morning floor: fixed wake time, water and food, ten minutes movement, two minutes daylight.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="28" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="14" font-weight="500" fill="#1c2b2a" text-anchor="start" dominant-baseline="central">The floor: 15 minutes, non-negotiable</text>
<rect x="40" y="56" width="600" height="56" rx="8" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<circle cx="70" cy="84" r="14" fill="#1f5a4c"/>
<text x="70" y="84" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
<text x="96" y="78" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="13" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">Fixed wake time</text>
<text x="96" y="98" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Not bedtime. Anchors the circadian rhythm.</text>
<rect x="40" y="124" width="600" height="56" rx="8" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<circle cx="70" cy="152" r="14" fill="#1f5a4c"/>
<text x="70" y="152" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
<text x="96" y="146" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="13" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">Water + food before coffee</text>
<text x="96" y="166" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Prevents the mid-morning crash.</text>
<rect x="40" y="192" width="600" height="56" rx="8" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<circle cx="70" cy="220" r="14" fill="#1f5a4c"/>
<text x="70" y="220" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
<text x="96" y="214" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="13" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">Ten minutes of movement</text>
<text x="96" y="234" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Walking counts. Signal, not training effect.</text>
<rect x="40" y="260" width="600" height="56" rx="8" fill="#f6f9f8" stroke="#e2e8e6" stroke-width="0.5"/>
<circle cx="70" cy="288" r="14" fill="#1f5a4c"/>
<text x="70" y="288" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
<text x="96" y="282" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="13" font-weight="500" fill="#1f5a4c" text-anchor="start" dominant-baseline="central">Two minutes of daylight</text>
<text x="96" y="302" font-family="-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif" font-size="12" font-weight="400" fill="#4a5c5a" text-anchor="start" dominant-baseline="central">Morning light is the strongest anchor.</text>
</svg>
