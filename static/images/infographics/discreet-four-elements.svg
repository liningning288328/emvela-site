<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" role="img">
<title>Four characteristics of genuinely discreet shipping</title>
<desc>Plain outer packaging, neutral sender name, no exterior description, and a neutral billing descriptor.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="28" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="500" fill="#1c2b2a" text-anchor="start" dominant-baseline="central">What discreet actually means</text>
<rect x="40" y="60" width="137.5" height="140" rx="10" fill="#f6f9f8" stroke="#1f5a4c" stroke-width="0.5"/>
<circle cx="108.75" cy="85" r="16" fill="#1f5a4c"/>
<text x="108.75" y="85" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
<text x="108.75" y="118" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Plain outer packaging</text>
<text x="108.75" y="144" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">Brown box or grey</text>
<text x="108.75" y="158" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">mailer, no imagery</text>
<text x="108.75" y="172" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">or logo</text>
<rect x="187.5" y="60" width="137.5" height="140" rx="10" fill="#f6f9f8" stroke="#1f5a4c" stroke-width="0.5"/>
<circle cx="256.25" cy="85" r="16" fill="#1f5a4c"/>
<text x="256.25" y="85" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
<text x="256.25" y="118" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Neutral sender name</text>
<text x="256.25" y="144" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">Parent company or</text>
<text x="256.25" y="158" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">generic trading</text>
<text x="256.25" y="172" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">name</text>
<rect x="335.0" y="60" width="137.5" height="140" rx="10" fill="#f6f9f8" stroke="#1f5a4c" stroke-width="0.5"/>
<circle cx="403.75" cy="85" r="16" fill="#1f5a4c"/>
<text x="403.75" y="85" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
<text x="403.75" y="118" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">No exterior description</text>
<text x="403.75" y="144" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">Customs: &quot;personal</text>
<text x="403.75" y="158" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">care item&quot; or</text>
<text x="403.75" y="172" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">&quot;wellness device&quot;</text>
<rect x="482.5" y="60" width="137.5" height="140" rx="10" fill="#f6f9f8" stroke="#1f5a4c" stroke-width="0.5"/>
<circle cx="551.25" cy="85" r="16" fill="#1f5a4c"/>
<text x="551.25" y="85" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
<text x="551.25" y="118" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="12" font-weight="500" fill="#1f5a4c" text-anchor="middle" dominant-baseline="central">Neutral billing descriptor</text>
<text x="551.25" y="144" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">The one people</text>
<text x="551.25" y="158" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">forget — and the</text>
<text x="551.25" y="172" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#4a5c5a" text-anchor="middle" dominant-baseline="central">most common leak</text>
</svg>
